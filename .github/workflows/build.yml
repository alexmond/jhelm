name: Build and Integration Test

# One long-lived branch per maintained Spring Boot line (main = latest line, plus a
# <major>.<minor> maintenance branch each), so CI runs on all of them, not just main.
on:
  push:
    branches: [ main, "[0-9]+.[0-9]+" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:   # manual run on any branch: gh workflow run build.yml --ref <branch>

jobs:
  build:
    name: build (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    # Compatibility matrix: the Java 21 baseline plus the later LTS releases this Spring Boot
    # line supports. Bytecode always targets 21 (java.version -> maven.compiler.release).
    # Every leg gets its own kind cluster and Helm binary, so the cluster-backed integration
    # tests run on each JDK. Reporting steps run once, on the baseline JDK, so results are
    # not uploaded twice.
    strategy:
      fail-fast: false
      matrix:
        java: [ '21', '25' ]

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: maven

      # The wrapper is distributionType=only-script, so it downloads Maven itself on
      # every run — a transient failure fetching apache-maven from Central has already
      # broken a parity job. setup-java's `cache: maven` only covers ~/.m2/repository,
      # so the distribution is cached separately, keyed on the pinned version.
      - name: Cache the Maven wrapper distribution
        uses: actions/cache@v6
        with:
          path: ~/.m2/wrapper
          key: maven-wrapper-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}

      - name: Create Kubernetes Cluster (Kind)
        uses: helm/kind-action@v1.15.1
        with:
          cluster_name: kind

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.14.2

      - name: Build with Maven
        # redirectTestOutputToFile keeps the per-chart rendered manifests out of the
        # surefire system-out (jhelm's tests embed full charts — GBs of XML otherwise),
        # which is what let the junit upload below widen to every module.
        run: ./mvnw clean install -B --fail-at-end -DredirectTestOutputToFile=true

      - name: Report tests + coverage to UniTrack
        if: ${{ always() && matrix.java == '21' }}
        uses: alexmond/unitrack/action@v0
        with:
          url: ${{ vars.UNITRACK_URL }}
          token: ${{ secrets.UNITRACK_TOKEN }}
          # soft-fail: reporting to UniTrack must never fail the build.
          split-by-module: "true"
          # The build runs with -DredirectTestOutputToFile=true, so the per-chart rendered
          # manifests no longer bloat the surefire system-out — the junit upload can now
          # cover every module instead of a single small one.
          soft-fail: "true"
          junit: '**/surefire-reports/TEST-*.xml'
          jacoco: '**/target/site/jacoco/jacoco.xml'

#      - name: Publish Test Results
#        uses: EnricoMi/publish-unit-test-result-action@v2
#        if: always()
#        with:
#          files: |
#            **/surefire-reports/TEST-*.xml

      - name: Add coverage to PR
        id: jacoco
        if: ${{ matrix.java == '21' }}
        uses: madrapps/jacoco-report@v1.8.0
        with:
          paths: |
            ${{ github.workspace }}/jhelm-core/target/site/jacoco/jacoco.xml,
            ${{ github.workspace }}/jhelm-kube/target/site/jacoco/jacoco.xml,
            ${{ github.workspace }}/jhelm-cli/target/site/jacoco/jacoco.xml,
            ${{ github.workspace }}/jhelm-rest/target/site/jacoco/jacoco.xml,
            ${{ github.workspace }}/jhelm-gotemplate-helm/target/site/jacoco/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          # Aligned with the JaCoCo build gate (BUNDLE LINE >= 0.75).
          min-coverage-overall: 75
          min-coverage-changed-files: 75

      - name: Add coverage to PR
        if: ${{ !cancelled() && matrix.java == '21' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: |
            ${{ github.workspace }}/jhelm-core/target/site/jacoco/jacoco.xml,
            ${{ github.workspace }}/jhelm-kube/target/site/jacoco/jacoco.xml,
            ${{ github.workspace }}/jhelm-cli/target/site/jacoco/jacoco.xml,
            ${{ github.workspace }}/jhelm-rest/target/site/jacoco/jacoco.xml,
            ${{ github.workspace }}/jhelm-gotemplate-helm/target/site/jacoco/jacoco.xml
          fail_ci_if_error: true

      - name: Upload test results to Codecov
        if: ${{ !cancelled() && matrix.java == '21' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: |
            **/surefire-reports/TEST-*.xml

      - name: Submit Dependency Snapshot
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.java == '21' }}
        uses: advanced-security/maven-dependency-submission-action@v6
